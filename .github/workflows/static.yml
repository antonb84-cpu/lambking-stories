name: Deploy Static Content to Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Lifted to job level so the publish step can gate on it — `secrets` is not
    # an allowed context inside a step-level `if`.
    env:
      LAMBKING_DEPLOY_TOKEN: ${{ secrets.LAMBKING_DEPLOY_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          ref: develop
          path: demo

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.8.0'

      - name: Clean install dependencies (Main)
        run: |
          rm -rf main/node_modules
          pnpm install --no-frozen-lockfile
        working-directory: main

      - name: Clean install dependencies (Develop)
        run: |
          rm -rf develop/node_modules
          pnpm install --no-frozen-lockfile
        working-directory: develop

      - name: Clean install dependencies (Demo)
        run: |
          rm -rf demo/node_modules
          pnpm install --no-frozen-lockfile
        working-directory: demo

      - name: Build Main Production
        run: npm run build-github-main
        working-directory: main
        env:
          VITE_CLIENT_KEY: ${{ secrets.LBS_CLIENT_KEY_PAGES }}

      - name: Build Develop Production
        run: npm run build-github-develop
        working-directory: develop
        env:
          VITE_CLIENT_KEY: ${{ secrets.LBS_CLIENT_KEY_PAGES }}

      - name: Build Demo Production
        run: npm run build-github-demo
        working-directory: demo
        env:
          VITE_CLIENT_KEY: ${{ secrets.LBS_CLIENT_KEY_PAGES }}

      - name: Build LambKing Website Production
        run: npm run build-github-lamb-king
        working-directory: main/website
        env:
          VITE_CLIENT_KEY: ${{ secrets.LBS_CLIENT_KEY_PAGES }}

      # Second build of the same site, served from the root of www.lambking.de
      # instead of the /little-bible-stories/lamb-king/ subpath.
      - name: Build LambKing Website for www.lambking.de
        run: npm run build-lambking-de
        working-directory: main/website
        env:
          VITE_CLIENT_KEY: ${{ secrets.LBS_CLIENT_KEY_PAGES }}

      - name: Create Dist Folder
        run: mkdir dist

      - name: Copy Main Build
        run: cp -r main/dist/* dist/

      - name: Copy Develop Build
        run: cp -r develop/dist/* dist/develop/

      - name: Copy Demo Build
        run: cp -r demo/dist/* dist/demo/

      # website/dist now holds two builds (lamb-king + lambking-de), so copy the
      # subpath one explicitly rather than globbing dist/*.
      - name: Copy LambKing Website Build
        run: |
          mkdir -p dist/lamb-king
          cp -r main/website/dist/lamb-king/* dist/lamb-king/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Publishes only the built website to the gh-pages branch of the separate
      # konstantinsteinmiller/lambking repo, which serves www.lambking.de.
      # Skipped silently until LAMBKING_DEPLOY_TOKEN is set in this repo's
      # secrets — a fine-grained PAT scoped to konstantinsteinmiller/lambking
      # with `Contents: read and write`. Uses `personal_token` rather than
      # `deploy_key` so there is no `ssh-add` step, which blocks forever on
      # stdin when handed a passphrase-protected key. `timeout-minutes` is a
      # backstop so any future auth hang fails fast instead of burning the job.
      - name: Publish LambKing Website to lambking repo
        if: ${{ env.LAMBKING_DEPLOY_TOKEN != '' }}
        timeout-minutes: 5
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.LAMBKING_DEPLOY_TOKEN }}
          external_repository: konstantinsteinmiller/lambking
          publish_branch: gh-pages
          publish_dir: main/website/dist/lambking-de
          commit_message: "deploy website from little-bible-stories@${{ github.sha }}"
