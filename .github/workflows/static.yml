name: Deploy Static Content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_CLIENT_KEY: ${{ secrets.LBS_CLIENT_KEY_PAGES }}
      # Backend both Pages builds talk to. Set the repository variable
      # API_BASE_URL to move them to another backend without a code change.
      # The fallback matters: an unset variable would otherwise arrive as an
      # empty string, which the website treats as "use the Vite dev proxy".
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://lbs-be.onrender.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.8.0'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build app
        run: npm run build-github-main

      - name: Build LambKing website
        run: npm run build-github-lamb-king
        working-directory: website

      - name: Add website build to the Pages artifact
        run: |
          mkdir -p dist/lamb-king
          cp -r website/dist/lamb-king/* dist/lamb-king/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
